<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Editor Portfolio</title>
  <meta name="description" content="รวมผลงานตัดต่อวิดีโอ โฆษณา คลิปสั้น มิวสิกวิดีโอ และ Motion Graphics">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;900&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1792319496">
</head>
<body>
  <header class="nav">
    <a href="#top" class="logo" id="navName"></a>
    <nav>
      <a href="#works">ผลงาน</a>
      <a href="#about">เกี่ยวกับ</a>
      <a href="#services">บริการ</a>
      <a href="#contact" class="btn small">ติดต่อ</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i></div>

      <h1 class="giant" id="heroWord"></h1>

      <button class="reel-btn" id="orb" type="button" aria-label="เล่น Showreel">
        <span class="play-ic"></span><span>Play reel</span>
      </button>

      <div class="hero-text">
        <p class="hero-tag" id="heroTagline"></p>
        <p class="hero-name" id="heroName"></p>
        <div class="hero-cta">
          <a href="#works" class="btn">ดูผลงาน</a>
          <a href="#contact" class="btn ghost">จ้างงาน</a>
        </div>
      </div>
    </section>

    <section id="works" class="section">
      <h2 class="label"><span>Selected Work</span></h2>
      <p class="muted work-summary" id="workSummary"></p>
      <div class="filters" id="filters"></div>
      <div id="clients"></div>
    </section>

    <section id="about" class="section">
      <div class="about">
        <div class="portrait" id="portrait">
          <div class="orbit" id="orbit"></div>
        </div>
        <div>
          <h2 class="label"><span>About Me</span></h2>
          <p class="name-th" id="nameTh"></p>
          <p class="name-en" id="nameEn"></p>
          <p class="lead" id="aboutText"></p>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </section>

    <section class="section tint" id="brandsSection">
      <h2 class="label"><span>Brands I've worked with</span></h2>
      <div class="brands" id="brands"></div>
    </section>

    <section id="services" class="section">
      <h2 class="label"><span>What I do</span></h2>
      <div class="services" id="services-list"></div>
    </section>

    <section id="contact" class="section contact-sec">
      <h2 class="label"><span>Let's work together</span></h2>
      <p class="muted">ส่งรายละเอียดงานมาได้เลย ตอบกลับภายใน 24 ชม.</p>
      <div class="contact" id="contactList"></div>
    </section>
  </main>

  <footer><span id="footName"></span> · © <span id="year"></span></footer>


  <script src="works.js?v=1792319496"></script>
  <script src="script.js?v=1792319496"></script>
</body>
</html>
